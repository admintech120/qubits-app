name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Build APK with Buildozer
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: 1
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "89330d3220593d30a6e935012a241b39c8187514\nd56f5185613500f18d00d72301dd9299c7716326\n24333f8a6371724430e8c8f001b3303d8b5f36e8" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qubits-app-apk
          path: bin/*.apk
