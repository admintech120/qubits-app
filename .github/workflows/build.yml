name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev libsqlite3-dev zlib1g-dev zip unzip autoconf automake libtool pkg-config cmake lld
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Link Android SDK Structure
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          ln -snf /usr/local/lib/android/sdk/build-tools build-tools
          ln -snf /usr/local/lib/android/sdk/platforms platforms
          ln -snf /usr/local/lib/android/sdk/platform-tools platform-tools
          ln -snf /usr/local/lib/android/sdk/cmdline-tools cmdline-tools
          ln -snf /usr/local/lib/android/sdk/licenses licenses
          mkdir -p tools/bin
          ln -snf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qubits-app-apk
          path: bin/*.apk
